<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Lean UX Canvas de Nexa</title>
  <desc id="desc">Síntesis visual de ocho boxes del baseline inicial de Lean UX para Nexa.</desc>
  <rect width="1600" height="1180" fill="#F7FAFF"/>
  <rect x="40" y="32" width="1520" height="92" rx="18" fill="#092E63"/>
  <text x="86" y="76" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="34" font-weight="700">Lean UX Canvas — Nexa</text>
  <text x="86" y="105" fill="#C9DDFF" font-family="Arial, sans-serif" font-size="19">Baseline inicial de aprendizaje · investigación primaria pendiente</text>

  <g fill="#FFFFFF" stroke="#A9C6E9" stroke-width="2">
    <rect x="60" y="160" width="700" height="200" rx="16"/>
    <rect x="840" y="160" width="700" height="200" rx="16"/>
    <rect x="60" y="410" width="700" height="200" rx="16"/>
    <rect x="840" y="410" width="700" height="200" rx="16"/>
    <rect x="60" y="660" width="700" height="200" rx="16"/>
    <rect x="840" y="660" width="700" height="200" rx="16"/>
    <rect x="60" y="910" width="700" height="200" rx="16"/>
    <rect x="840" y="910" width="700" height="200" rx="16"/>
  </g>

  <g font-family="Arial, sans-serif">
    <g>
      <circle cx="105" cy="207" r="25" fill="#0D62B8"/>
      <text x="105" y="215" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">1</text>
      <text x="150" y="208" fill="#092E63" font-size="25" font-weight="700">Business Problem</text>
      <text x="95" y="264" fill="#26384D" font-size="23"><tspan x="95" dy="0">El contexto puede fragmentarse cuando</tspan><tspan x="95" dy="32">cambia la responsabilidad sobre un pedido B2B.</tspan></text>
    </g>
    <g>
      <circle cx="885" cy="207" r="25" fill="#0D62B8"/>
      <text x="885" y="215" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">2</text>
      <text x="930" y="208" fill="#092E63" font-size="25" font-weight="700">Business Outcomes</text>
      <text x="875" y="264" fill="#26384D" font-size="23"><tspan x="875" dy="0">Menos reconstrucción · Attempts atribuibles</tspan><tspan x="875" dy="32">· recepción/discrepancia con contexto.</tspan></text>
    </g>
    <g>
      <circle cx="105" cy="457" r="25" fill="#0D62B8"/>
      <text x="105" y="465" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">3</text>
      <text x="150" y="458" fill="#092E63" font-size="25" font-weight="700">Users and Customers</text>
      <text x="95" y="514" fill="#26384D" font-size="23"><tspan x="95" dy="0">Warehouse + Dispatch · Driver</tspan><tspan x="95" dy="32">· Customer Buyer.</tspan></text>
    </g>
    <g>
      <circle cx="885" cy="457" r="25" fill="#0D62B8"/>
      <text x="885" y="465" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">4</text>
      <text x="930" y="458" fill="#092E63" font-size="25" font-weight="700">User Benefits / Outcomes</text>
      <text x="875" y="514" fill="#26384D" font-size="23"><tspan x="875" dy="0">Preparar/handoff con claridad · Attempt</tspan><tspan x="875" dy="32">atribuible · receipt/discrepancy con contexto.</tspan></text>
    </g>
    <g>
      <circle cx="105" cy="707" r="25" fill="#0D62B8"/>
      <text x="105" y="715" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">5</text>
      <text x="150" y="708" fill="#092E63" font-size="25" font-weight="700">Solution Ideas</text>
      <text x="95" y="764" fill="#26384D" font-size="23"><tspan x="95" dy="0">FA1 continuity · FA2 Attempt/evidence</tspan><tspan x="95" dy="32">· FA3 receipt/discrepancy.</tspan></text>
    </g>
    <g>
      <circle cx="885" cy="707" r="25" fill="#0D62B8"/>
      <text x="885" y="715" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">6</text>
      <text x="930" y="708" fill="#092E63" font-size="25" font-weight="700">Hypotheses</text>
      <text x="875" y="764" fill="#26384D" font-size="23"><tspan x="875" dy="0">H1, H2 y H3: una hypothesis</tspan><tspan x="875" dy="32">por Feature Assumption primaria.</tspan></text>
    </g>
    <g>
      <circle cx="105" cy="957" r="25" fill="#0D62B8"/>
      <text x="105" y="965" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">7</text>
      <text x="150" y="958" fill="#092E63" font-size="25" font-weight="700">Learn First</text>
      <text x="95" y="1014" fill="#26384D" font-size="23"><tspan x="95" dy="0">¿Es material la fricción preparación →</tspan><tspan x="95" dy="32">readiness → handoff entre responsabilidades?</tspan></text>
    </g>
    <g>
      <circle cx="885" cy="957" r="25" fill="#0D62B8"/>
      <text x="885" y="965" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">8</text>
      <text x="930" y="958" fill="#092E63" font-size="25" font-weight="700">Least Work to Learn</text>
      <text x="875" y="1014" fill="#26384D" font-size="23"><tspan x="875" dy="0">Observar As-Is · línea base · prototipo</tspan><tspan x="875" dy="32">de baja fidelidad · mantener/ajustar/descartar.</tspan></text>
    </g>
  </g>

  <text x="800" y="1150" text-anchor="middle" fill="#53677E" font-family="Arial, sans-serif" font-size="18">Los contenidos son hypotheses de producto; no implican investigación validada, implementación ni aceptación.</text>
</svg>
