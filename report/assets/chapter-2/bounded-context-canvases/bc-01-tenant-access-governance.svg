<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1244" viewBox="0 0 1600 1244">
<rect width="100%" height="100%" fill="#f7f9fb"/>
<rect width="1600" height="120" fill="#3d5a80"/>
<text x="46" y="62" font-family="Arial, Helvetica, sans-serif" font-size="34px" font-weight="700" fill="#ffffff">BC-01 Tenant &amp; Access Governance — Bounded Context Canvas</text>
<text x="46" y="98" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#e7eef3">Strategic DDD visual summary sourced from 2.5.1.3</text>
<rect x="46" y="142" width="300" height="38" rx="19" fill="#3d5a80"/>
<text x="68" y="167" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="700" fill="#ffffff">Classification: Supporting</text>
<rect x="46" y="216" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="46" y="216" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="46" y="256" width="750" height="14" fill="#eaf0f5"/>
<text x="68" y="251" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Context / Purpose</text>
<text x="68" y="304" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Es la frontera máxima de aislamiento. Posee Tenant lifecycle,</text>
<text x="68" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Tenant 1:1 Workspace, Human Identity linkage, Workforce</text>
<text x="68" y="356" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Membership, roles, capabilities y AccessContext fail-closed. No</text>
<text x="68" y="382" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">posee Customer Account, price, inventory o delivery.</text>
<rect x="824" y="216" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="824" y="216" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="824" y="256" width="750" height="14" fill="#eaf0f5"/>
<text x="846" y="251" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Ubiquitous Language / Invariants</text>
<text x="846" y="304" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Tenant es isolation boundary; Workspace es su entorno operativo</text>
<text x="846" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">V1. Missing o ambiguous scope falla cerrado. El Tenant ID del</text>
<text x="846" y="356" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">cliente no es autoridad. Human Identity, Workforce Membership y</text>
<text x="846" y="382" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Buyer Relationship permanecen distintos.</text>
<rect x="46" y="544" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="46" y="544" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="46" y="584" width="750" height="14" fill="#eaf0f5"/>
<text x="68" y="579" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Capabilities</text>
<text x="68" y="632" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Company onboarding, Tenant/Workspace activation, identity linkage,</text>
<text x="68" y="658" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">membership grant/change, capability evaluation, ownership</text>
<text x="68" y="684" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">governance, suspension y revocation.</text>
<rect x="824" y="544" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="824" y="544" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="824" y="584" width="750" height="14" fill="#eaf0f5"/>
<text x="846" y="579" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Capability Layering</text>
<text x="846" y="632" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Tenant lifecycle habilita o suspende la compañía. Access</text>
<text x="846" y="658" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">governance evalúa membership y capability. Isolation aplica</text>
<text x="846" y="684" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">autorización y scope fail-closed. Security Audit queda separado de</text>
<text x="846" y="710" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Business Traceability.</text>
<rect x="46" y="872" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="46" y="872" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="46" y="912" width="750" height="14" fill="#eaf0f5"/>
<text x="68" y="907" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Inbound / Outbound Dependencies</text>
<text x="68" y="960" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Consume onboarding identity input de Website o Nexa staff. Entrega</text>
<text x="68" y="986" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">authorized Tenant/Workspace context a todos los BC tenant-scoped y</text>
<text x="68" y="1012" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">superficies. La autorización es síncrona; los procesos en segundo</text>
<text x="68" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">plano deben reconstruir un contexto explícito y no continuar con</text>
<text x="68" y="1064" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">scope ambiguo.</text>
<rect x="824" y="872" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="824" y="872" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="824" y="912" width="750" height="14" fill="#eaf0f5"/>
<text x="846" y="907" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Design Critique / Rejected Alternative</text>
<text x="846" y="960" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Alternativa: fusionarlo con Customer &amp; Buyer Relationships haría</text>
<text x="846" y="986" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">onboarding más corto, pero permitiría confundir aislamiento con</text>
<text x="846" y="1012" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">relación comercial. Se mantiene separado para garantizar</text>
<text x="846" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">fail-closed isolation sin asumir que toda identidad con acceso</text>
<text x="846" y="1064" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">técnico es Buyer o Customer.</text>
<text x="46" y="1216" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="#5e6b78">Source: accepted semantic canvas content in report/2.5.1.3</text>
</svg>
