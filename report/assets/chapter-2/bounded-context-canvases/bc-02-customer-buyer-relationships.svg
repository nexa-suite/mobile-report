<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1244" viewBox="0 0 1600 1244">
<rect width="100%" height="100%" fill="#f7f9fb"/>
<rect width="1600" height="120" fill="#3d5a80"/>
<text x="46" y="62" font-family="Arial, Helvetica, sans-serif" font-size="34px" font-weight="700" fill="#ffffff">BC-02 Customer &amp; Buyer Relationships — Bounded Context Canvas</text>
<text x="46" y="98" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#e7eef3">Strategic DDD visual summary sourced from 2.5.1.3</text>
<rect x="46" y="142" width="300" height="38" rx="19" fill="#3d5a80"/>
<text x="68" y="167" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="700" fill="#ffffff">Classification: Supporting</text>
<rect x="46" y="216" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="46" y="216" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="46" y="256" width="750" height="14" fill="#eaf0f5"/>
<text x="68" y="251" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Context / Purpose</text>
<text x="68" y="304" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">BC-02 define Customer Account, contacts, addresses, Buyer</text>
<text x="68" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Relationship, invitation, approval y principal Buyer Identity</text>
<text x="68" y="356" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">link. Su pregunta es quién puede comprar de qué Tenant. No owns</text>
<text x="68" y="382" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Human Identity, Workforce Membership, catalog price, credit o</text>
<text x="68" y="408" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">order lifecycle.</text>
<rect x="824" y="216" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="824" y="216" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="824" y="256" width="750" height="14" fill="#eaf0f5"/>
<text x="846" y="251" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Ubiquitous Language / Invariants</text>
<text x="846" y="304" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Customer Account puede existir sin Portal identity. Buyer</text>
<text x="846" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Relationship es supplier-Tenant scoped y requiere aprobación</text>
<text x="846" y="356" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">explícita. V1 permite un principal active Buyer Identity por</text>
<text x="846" y="382" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">account. SUSPENDED y REVOKED conservan historia. Buyer</text>
<text x="846" y="408" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Relationship no es Workforce Membership ni global Human Identity.</text>
<rect x="46" y="544" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="46" y="544" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="46" y="584" width="750" height="14" fill="#eaf0f5"/>
<text x="68" y="579" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Capabilities</text>
<text x="68" y="632" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Las capacidades son customer account lifecycle, contacts,</text>
<text x="68" y="658" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">addresses, relationship request/invitation, approval, principal</text>
<text x="68" y="684" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">identity linking, suspension, revocation y eligibility resolution.</text>
<rect x="824" y="544" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="824" y="544" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="824" y="584" width="750" height="14" fill="#eaf0f5"/>
<text x="846" y="579" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Capability Layering</text>
<text x="846" y="632" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">La capa account management conserva datos del cliente. La capa</text>
<text x="846" y="658" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">relationship governance decide elegibilidad y lifecycle. La capa</text>
<text x="846" y="684" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">projection expone referencias autorizadas a Catalog, Sales y</text>
<text x="846" y="710" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Portal/Mobile sin duplicar Customer Account completo.</text>
<rect x="46" y="872" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="46" y="872" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="46" y="912" width="750" height="14" fill="#eaf0f5"/>
<text x="68" y="907" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Inbound / Outbound Dependencies</text>
<text x="68" y="960" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Entra authorized Tenant context de BC-01 y una referencia de Human</text>
<text x="68" y="986" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Identity; sale relationship eligibility y Customer/Buyer</text>
<text x="68" y="1012" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">references a BC-03 y BC-04. Approval/link es síncrono e</text>
<text x="68" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">idempotente. Las superficies consumen la relación por contrato y</text>
<text x="68" y="1064" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">no almacenan una authority local.</text>
<rect x="824" y="872" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="824" y="872" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="824" y="912" width="750" height="14" fill="#eaf0f5"/>
<text x="846" y="907" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Design Critique / Rejected Alternative</text>
<text x="846" y="960" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Fusionar BC-02 con Tenant &amp; Access simplificaría el onboarding,</text>
<text x="846" y="986" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">pero mezclaría technical access con una relación comercial</text>
<text x="846" y="1012" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">supplier-buyer. Separarlos permite que una identidad tenga</text>
<text x="846" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">relaciones independientes sin conceder datos de otro Tenant.</text>
<text x="46" y="1216" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="#5e6b78">Source: accepted semantic canvas content in report/2.5.1.3</text>
</svg>
