<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1244" viewBox="0 0 1600 1244">
<rect width="100%" height="100%" fill="#f7f9fb"/>
<rect width="1600" height="120" fill="#0f4c5c"/>
<text x="46" y="62" font-family="Arial, Helvetica, sans-serif" font-size="34px" font-weight="700" fill="#ffffff">BC-06 Fulfillment &amp; Delivery — Bounded Context Canvas</text>
<text x="46" y="98" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#e7eef3">Strategic DDD visual summary sourced from 2.5.1.3</text>
<rect x="46" y="142" width="300" height="38" rx="19" fill="#0f4c5c"/>
<text x="68" y="167" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="700" fill="#ffffff">Classification: Core</text>
<rect x="46" y="216" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="46" y="216" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="46" y="256" width="750" height="14" fill="#eaf0f5"/>
<text x="68" y="251" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#0f4c5c">Context / Purpose</text>
<text x="68" y="304" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">BC-06 ejecuta fulfillment, picking, packing, staging, dispatch,</text>
<text x="68" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Delivery, attempts, continuation, POD y evidencia operativa de</text>
<text x="68" y="356" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">cold chain. No owns Physical Stock, Commercial Commitment,</text>
<text x="68" y="382" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Credit/Payment ni issued document history.</text>
<rect x="824" y="216" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="824" y="216" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="824" y="256" width="750" height="14" fill="#eaf0f5"/>
<text x="846" y="251" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#0f4c5c">Ubiquitous Language / Invariants</text>
<text x="846" y="304" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Fulfillment materializa una obligación confirmada contra Physical</text>
<text x="846" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Allocation. Dispatch Handoff no es Delivery Attempt. Driver</text>
<text x="846" y="356" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Outcome no es Buyer Receipt. POD es evidencia inmutable. Un failed</text>
<text x="846" y="382" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">attempt permanece en el mismo Delivery. Una partial delivery</text>
<text x="846" y="408" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">conserva cantidades y crea Continuation Delivery para lo restante…</text>
<rect x="46" y="544" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="46" y="544" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="46" y="584" width="750" height="14" fill="#eaf0f5"/>
<text x="68" y="579" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#0f4c5c">Capabilities</text>
<text x="68" y="632" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Las capacidades son fulfillment planning, allocation execution,</text>
<text x="68" y="658" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">picking, packing, staging, Dispatch Handoff, Delivery scheduling,</text>
<text x="68" y="684" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">attempt recording, outcome capture, POD, discrepancy, continuation</text>
<text x="68" y="710" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">y temperature evidence.</text>
<rect x="824" y="544" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="824" y="544" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="824" y="584" width="750" height="14" fill="#eaf0f5"/>
<text x="846" y="579" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#0f4c5c">Capability Layering</text>
<text x="846" y="632" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">La capa warehouse execution mueve una asignación por los estados</text>
<text x="846" y="658" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">operativos. La capa dispatch and delivery conserva handoff,</text>
<text x="846" y="684" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">attempts y outcomes. La capa evidence and continuation protege</text>
<text x="846" y="710" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">POD, discrepancies, cold-chain evidence y remaining obligation…</text>
<rect x="46" y="872" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="46" y="872" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="46" y="912" width="750" height="14" fill="#eaf0f5"/>
<text x="68" y="907" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#0f4c5c">Inbound / Outbound Dependencies</text>
<text x="68" y="960" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Entra confirmed Sales Order de BC-04 y Physical</text>
<text x="68" y="986" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Allocation/movement contract de BC-05. Sale physical mutation</text>
<text x="68" y="1012" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">requests a BC-05, Delivery/POD facts a BC-09, notification</text>
<text x="68" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">candidates a BC-10 y durable facts a BC-11…</text>
<rect x="824" y="872" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="824" y="872" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="824" y="912" width="750" height="14" fill="#eaf0f5"/>
<text x="846" y="907" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#0f4c5c">Design Critique / Rejected Alternative</text>
<text x="846" y="960" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Separar Fulfillment y Delivery permitiría equipos independientes,</text>
<text x="846" y="986" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">pero rompería continuidad entre allocated quantity, handoff,</text>
<text x="846" y="1012" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">attempt y continuation. Mantenerlos juntos en V1 protege la</text>
<text x="846" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">historia operativa; Business Traceability permanece separado</text>
<text x="846" y="1064" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">porque proyecta hechos y no decide delivery.</text>
<text x="46" y="1216" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="#5e6b78">Source: accepted semantic canvas content in report/2.5.1.3</text>
</svg>
