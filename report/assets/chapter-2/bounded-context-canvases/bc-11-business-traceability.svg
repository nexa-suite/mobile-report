<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1244" viewBox="0 0 1600 1244">
<rect width="100%" height="100%" fill="#f7f9fb"/>
<rect width="1600" height="120" fill="#3d5a80"/>
<text x="46" y="62" font-family="Arial, Helvetica, sans-serif" font-size="34px" font-weight="700" fill="#ffffff">BC-11 Business Traceability — Bounded Context Canvas</text>
<text x="46" y="98" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#e7eef3">Strategic DDD visual summary sourced from 2.5.1.3</text>
<rect x="46" y="142" width="300" height="38" rx="19" fill="#3d5a80"/>
<text x="68" y="167" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="700" fill="#ffffff">Classification: Supporting</text>
<rect x="46" y="216" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="46" y="216" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="46" y="256" width="750" height="14" fill="#eaf0f5"/>
<text x="68" y="251" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Context / Purpose</text>
<text x="68" y="304" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Conserva una representación durable, tenant-scoped y consultable</text>
<text x="68" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">de hechos significativos: actor, reason, evidence, correlation,</text>
<text x="68" y="356" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">before/after y timeline. No posee source aggregate, Notification</text>
<text x="68" y="382" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">delivery ni Security Audit.</text>
<rect x="824" y="216" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="824" y="216" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="824" y="256" width="750" height="14" fill="#eaf0f5"/>
<text x="846" y="251" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Ubiquitous Language / Invariants</text>
<text x="846" y="304" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Business Fact es referencia segura a un hecho confirmado. Los</text>
<text x="846" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">registros son append-only. Una correction agrega otro hecho. La</text>
<text x="846" y="356" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">proyección no concede acceso ni modifica la fuente; secretos y PII</text>
<text x="846" y="382" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">innecesaria quedan fuera.</text>
<rect x="46" y="544" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="46" y="544" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="46" y="584" width="750" height="14" fill="#eaf0f5"/>
<text x="68" y="579" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Capabilities</text>
<text x="68" y="632" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Significant-fact selection, append-only recording, timeline</text>
<text x="68" y="658" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">projection, evidence-reference management, correlation y</text>
<text x="68" y="684" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">sensitive-payload filtering.</text>
<rect x="824" y="544" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="824" y="544" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="824" y="584" width="750" height="14" fill="#eaf0f5"/>
<text x="846" y="579" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Capability Layering</text>
<text x="846" y="632" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Capture recibe hechos publicados. Projection construye timelines</text>
<text x="846" y="658" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">autorizadas. Evidence mantiene referencias y hashes sin asumir</text>
<text x="846" y="684" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">ownership de los bytes de Object Storage.</text>
<rect x="46" y="872" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="46" y="872" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="46" y="912" width="750" height="14" fill="#eaf0f5"/>
<text x="68" y="907" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Inbound / Outbound Dependencies</text>
<text x="68" y="960" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Consume hechos publicados de los source BCs y Notification</text>
<text x="68" y="986" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">delivery outcomes. Entrega timeline autorizada y representación de</text>
<text x="68" y="1012" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">evidencia. La relación es asíncrona, durable y replayable; una</text>
<text x="68" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">falla de proyección no revierte el commit fuente.</text>
<rect x="824" y="872" width="750" height="300" rx="14" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
<rect x="824" y="872" width="750" height="54" rx="14" fill="#eaf0f5"/>
<rect x="824" y="912" width="750" height="14" fill="#eaf0f5"/>
<text x="846" y="907" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" fill="#3d5a80">Design Critique / Rejected Alternative</text>
<text x="846" y="960" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">Alternativa: usar Notifications como timeline reduciría</text>
<text x="846" y="986" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">consumidores, pero una falla o retención de comunicación</text>
<text x="846" y="1012" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">deformaría la historia de negocio. Se mantiene separado para</text>
<text x="846" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#18212b">preservar evidencia durable y distinguirla de Security Audit.</text>
<text x="46" y="1216" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="#5e6b78">Source: Semantic Canvas, section 2.5.1.3.</text>
</svg>
